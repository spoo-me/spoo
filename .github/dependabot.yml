version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    ignore:
      # redis-py 8.x is blocked for now (see pyproject.toml pin).
      - dependency-name: "redis"
        versions: [">=8"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
