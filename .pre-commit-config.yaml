repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-comment-blocks
        name: no multi-line comment blocks
        entry: python3 scripts/hooks/no_comment_blocks.py
        language: system
        types: [python]
